{% extends "base.html" %}

{% block title %}Family Access · Pick-A-Party{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Family Portal Access</h1>
        <p class="text-muted">Enter the shared password provided by the school to browse and purchase parties.</p>
        <form method="post">
          <div class="mb-3">
            <label for="shared_password" class="form-label">Shared Password</label>
            <input type="password" class="form-control" id="shared_password" name="shared_password" required autofocus>
          </div>
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
